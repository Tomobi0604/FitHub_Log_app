<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitHub - 月別ダイエット総合管理アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 sm:py-0">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:h-16 justify-center items-center gap-2.5 sm:gap-0">
                
                <!-- Logo & Main Add Action -->
                <div class="flex justify-between items-center w-full sm:w-auto">
                    <div class="flex items-center space-x-2.5">
                        <div class="bg-emerald-500 text-white p-1.5 sm:p-2 rounded-xl shadow-md">
                            <i data-lucide="activity" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                        </div>
                        <span class="text-lg sm:text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">
                            FitHub Log
                        </span>
                    </div>

                    <!-- Mobile Add Button (Visible only on small screens) -->
                    <button onclick="openModal('add-log-modal')" class="sm:hidden bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition flex items-center space-x-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>記録追加</span>
                    </button>
                </div>

                <!-- Google Health Real Sync & Data Sync Buttons -->
                <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto space-x-2 overflow-x-auto pb-1 sm:pb-0">
                    <!-- データバックアップ・同期用ボタン（Google ドライブ連携） -->
                    <div class="flex items-center space-x-1.5">
                        <button onclick="saveToGoogleDrive()" title="Googleドライブへ保存" class="flex items-center space-x-1 bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1.5 rounded-lg text-xs font-medium transition border border-slate-300 shrink-0">
                            <i data-lucide="cloud-upload" class="w-3.5 h-3.5 text-blue-600"></i>
                            <span>保存</span>
                        </button>
                        <button onclick="loadFromGoogleDrive()" title="Googleドライブから同期" class="flex items-center space-x-1 bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1.5 rounded-lg text-xs font-medium transition border border-slate-300 shrink-0">
                            <i data-lucide="cloud-download" class="w-3.5 h-3.5 text-indigo-600"></i>
                            <span>読込</span>
                        </button>
                    </div>

                    <button id="sync-health-btn" onclick="handleGoogleFitSync()" class="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium transition border border-slate-300 shrink-0">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-emerald-600" id="sync-icon"></i>
                        <span id="sync-status">Google同期</span>
                    </button>

                    <!-- Desktop Add Button (Hidden on small screens) -->
                    <button onclick="openModal('add-log-modal')" class="hidden sm:flex bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition items-center space-x-1 shrink-0">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>記録を追加</span>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Month Selector & Summary Row -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center space-x-4">
                <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg transition text-slate-600">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <h2 id="current-month-display" class="text-2xl font-bold text-slate-800">2026年 10月</h2>
                <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg transition text-slate-600">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Monthly Quick Stats -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full md:w-auto">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 min-w-[110px]">
                    <span class="text-xs text-slate-500 font-medium block">平均歩数</span>
                    <span id="stat-avg-steps" class="text-lg font-bold text-slate-700">-- 歩</span>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 min-w-[110px]">
                    <span class="text-xs text-slate-500 font-medium block">平均体重</span>
                    <span id="stat-avg-weight" class="text-lg font-bold text-slate-700">-- kg</span>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 min-w-[110px]">
                    <span class="text-xs font-medium text-amber-600 block">あすけん記録</span>
                    <span id="stat-food-count" class="text-lg font-bold text-amber-700">0 日</span>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 min-w-[110px]">
                    <span class="text-xs font-medium text-indigo-600 block">筋トレ記録</span>
                    <span id="stat-workout-count" class="text-lg font-bold text-indigo-700">0 日</span>
                </div>
            </div>
        </div>

        <!-- Monthly Graph Overview -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Weight Chart Card -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="text-sm font-semibold text-slate-700 mb-4 flex items-center space-x-2">
                    <i data-lucide="scale" class="w-4 h-4 text-emerald-600"></i>
                    <span id="weight-chart-title">今月の体重推移 (kg)</span>
                </h3>
                <div class="h-56 w-full">
                    <canvas id="weightChart"></canvas>
                </div>
            </div>

            <!-- Steps Chart Card -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="text-sm font-semibold text-slate-700 mb-4 flex items-center space-x-2">
                    <i data-lucide="footprints" class="w-4 h-4 text-teal-600"></i>
                    <span id="steps-chart-title">今月の歩数推移 (歩)</span>
                </h3>
                <div class="h-56 w-full">
                    <canvas id="stepsChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Logs View Section Header & View Selector -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pt-2 border-t border-slate-200">
            <h3 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                <i data-lucide="calendar" class="w-5 h-5 text-emerald-600"></i>
                <span>記録リスト</span>
            </h3>
            
            <!-- View Mode Switcher (Month / Week / Day) -->
            <div class="flex items-center bg-slate-200/80 p-1 rounded-xl text-xs font-semibold text-slate-600">
                <button id="view-btn-month" onclick="setViewMode('month')" class="px-3 py-1.5 rounded-lg transition bg-white text-slate-800 shadow-sm">
                    月表示
                </button>
                <button id="view-btn-week" onclick="setViewMode('week')" class="px-3 py-1.5 rounded-lg transition hover:text-slate-800">
                    週表示
                </button>
                <button id="view-btn-day" onclick="setViewMode('day')" class="px-3 py-1.5 rounded-lg transition hover:text-slate-800">
                    日表示
                </button>
            </div>
        </div>

        <!-- Daily Logs Cards Grid/Timeline -->
        <div id="logs-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Content -->
        </div>

    </main>

    <!-- Modal: Add / Edit Daily Log -->
    <div id="add-log-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden my-8">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">記録の追加 / 編集</h3>
                <button onclick="closeModal('add-log-modal')" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <form id="log-form" onsubmit="saveLog(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">日付</label>
                    <input type="date" id="form-date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-xl space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-emerald-800 uppercase flex items-center space-x-1">
                            <i data-lucide="activity" class="w-4 h-4 text-emerald-600"></i>
                            <span>Google Health データ</span>
                        </span>
                        <button type="button" onclick="fillMockHealthData()" class="text-xs bg-emerald-200 text-emerald-800 hover:bg-emerald-300 px-2 py-1 rounded font-medium">
                            テスト値生成
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-600 mb-1">歩数 (歩)</label>
                            <input type="number" id="form-steps" placeholder="7500" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-600 mb-1">体重 (kg)</label>
                            <input type="number" step="0.1" id="form-weight" placeholder="65.0" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm">
                        </div>
                    </div>
                </div>

                <div class="border border-slate-200 p-4 rounded-xl space-y-2">
                    <label class="block text-xs font-bold text-amber-800 uppercase flex items-center space-x-1">
                        <i data-lucide="utensils" class="w-4 h-4 text-amber-600"></i>
                        <span>あすけん（食事スクショ・複数可）</span>
                    </label>
                    <input type="file" id="form-asuken-file" accept="image/*" multiple onchange="handleMultipleImages(this, 'asuken')" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200">
                    <div id="asuken-preview-container" class="grid grid-cols-3 gap-2 mt-2">
                        <!-- 動的に複数画像プレビューが追加されます -->
                    </div>
                    <textarea id="form-asuken-memo" placeholder="食事に関するメモ（カロリー、PFCなど）" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs mt-2"></textarea>
                </div>

                <div class="border border-slate-200 p-4 rounded-xl space-y-2">
                    <label class="block text-xs font-bold text-indigo-800 uppercase flex items-center space-x-1">
                        <i data-lucide="dumbbell" class="w-4 h-4 text-indigo-600"></i>
                        <span>筋トレメモ（スクショ・複数可）</span>
                    </label>
                    <input type="file" id="form-workout-file" accept="image/*" multiple onchange="handleMultipleImages(this, 'workout')" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200">
                    <div id="workout-preview-container" class="grid grid-cols-3 gap-2 mt-2">
                        <!-- 動的に複数画像プレビューが追加されます -->
                    </div>
                    <textarea id="form-workout-memo" placeholder="トレーニング内容・部位のメモ" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs mt-2"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal('add-log-modal')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">キャンセル</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="delete-confirm-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden p-6 space-y-4">
            <div class="flex items-center space-x-3 text-rose-600">
                <div class="p-2 bg-rose-100 rounded-xl">
                    <i data-lucide="trash-2" class="w-6 h-6"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800">記録の削除</h3>
            </div>
            <p class="text-sm text-slate-600">
                <span id="delete-date-text" class="font-semibold text-slate-800"></span> の記録を削除しますか？この操作は取り消せません。
            </p>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeModal('delete-confirm-modal')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium">キャンセル</button>
                <button id="confirm-delete-btn" class="px-4 py-2 text-sm bg-rose-600 hover:bg-rose-700 text-white font-medium rounded-lg shadow-sm">削除する</button>
            </div>
        </div>
    </div>

    <!-- Image View Modal -->
    <div id="image-view-modal" class="fixed inset-0 z-50 hidden bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal('image-view-modal')">
        <div class="max-w-3xl max-h-[90vh] overflow-hidden rounded-xl bg-black">
            <img id="enlarged-image" src="" class="max-w-full max-h-[90vh] object-contain">
        </div>
    </div>

    <script>
        // --- GOOGLE API CONFIGURATION ---
        // Step 1でコピーしたクライアントIDをここに貼り付けてください
        const GOOGLE_CLIENT_ID = '84961533777-9v8b9q99mf16n4gk4745alhb6sf2ius8.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/fitness.activity.read https://www.googleapis.com/auth/fitness.body.read';

        // ★★★ 発行した GAS のウェブアプリ URL をここに貼り付けてください ★★★
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzBJ9diZoSxlBRfGg9TyDLRdddQCB2jZoAhGko0sT0blymb92ZnZJWTveuLWHI3orI5ig/exec';

        let tokenClient;
        let accessToken = null;

        // State Management
        let currentDate = new Date();
        let currentViewMode = 'month';
        let logsData = {};
        let weightChartInstance = null;
        let stepsChartInstance = null;

        // 一時保持用画像配列 (フォーム用)
        let currentFormImages = {
            asuken: [],
            workout: []
        };

        window.onload = function() {
            // ローカルストレージからの初期データ読み込み
            loadLogsFromStorage();
            
            // Google GIS ライブラリの初期化
            initGoogleClient();

            // グラフおよびダッシュボードの初期化描画
            initCharts();
            renderDashboard();

            // Lucideアイコンの生成
            lucide.createIcons();
        };

        // ローカルストレージからデータをロード
        function loadLogsFromStorage() {
            const stored = localStorage.getItem('fithub_logs_data');
            if (stored) {
                try {
                    logsData = JSON.parse(stored);
                } catch (e) {
                    console.error("ストレージデータの読み込みエラー:", e);
                    logsData = {};
                }
            } else {
                logsData = {};
                saveLogsToStorage();
            }
        }

        function openModal(modalId, dateStr = null) {
            document.getElementById(modalId).classList.remove('hidden');
            if (modalId === 'add-log-modal') {
                const dateVal = dateStr || new Date().toISOString().split('T')[0];
                document.getElementById('form-date').value = dateVal;
                
                const existing = logsData[dateVal] || {};
                document.getElementById('form-steps').value = existing.steps || '';
                document.getElementById('form-weight').value = existing.weight || '';
                document.getElementById('form-asuken-memo').value = existing.foodMemo || '';
                document.getElementById('form-workout-memo').value = existing.workoutMemo || '';

                // 互換性対応：配列化（単一文字列データの場合も配列に変換）
                currentFormImages.asuken = Array.isArray(existing.foodImg) ? [...existing.foodImg] : (existing.foodImg ? [existing.foodImg] : []);
                currentFormImages.workout = Array.isArray(existing.workoutImg) ? [...existing.workoutImg] : (existing.workoutImg ? [existing.workoutImg] : []);

                renderImagePreviews('asuken');
                renderImagePreviews('workout');
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // 複数画像ファイル読み込みハンドラ
        function handleMultipleImages(input, type) {
            const files = Array.from(input.files);
            if (!files.length) return;

            let loadedCount = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentFormImages[type].push(e.target.result);
                    loadedCount++;
                    if (loadedCount === files.length) {
                        renderImagePreviews(type);
                        input.value = ''; // 連続選択可能にするためクリア
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // プレビュー表示レンダリング
        function renderImagePreviews(type) {
            const container = document.getElementById(`${type}-preview-container`);
            container.innerHTML = '';

            currentFormImages[type].forEach((imgSrc, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'relative group aspect-video rounded-lg overflow-hidden border border-slate-200 bg-slate-100';
                wrapper.innerHTML = `
                    <img src="${imgSrc}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeImageAt('${type}', ${idx})" class="absolute top-1 right-1 bg-rose-500 hover:bg-rose-600 text-white p-1 rounded-full shadow transition">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                `;
                container.appendChild(wrapper);
            });
            lucide.createIcons();
        }

        // 特定インデックスの画像削除
        function removeImageAt(type, index) {
            currentFormImages[type].splice(index, 1);
            renderImagePreviews(type);
        }

        function saveLog(e) {
            e.preventDefault();
            const dateVal = document.getElementById('form-date').value;
            if (!dateVal) return;

            logsData[dateVal] = {
                steps: parseInt(document.getElementById('form-steps').value) || 0,
                weight: parseFloat(document.getElementById('form-weight').value) || null,
                foodImg: [...currentFormImages.asuken],
                foodMemo: document.getElementById('form-asuken-memo').value,
                workoutImg: [...currentFormImages.workout],
                workoutMemo: document.getElementById('form-workout-memo').value
            };

            saveLogsToStorage();
            closeModal('add-log-modal');
            renderDashboard();
        }

        function confirmDeleteLog(dateStr) {
            document.getElementById('delete-date-text').textContent = dateStr;
            const confirmBtn = document.getElementById('confirm-delete-btn');
            confirmBtn.onclick = function() {
                delete logsData[dateStr];
                saveLogsToStorage();
                closeModal('delete-confirm-modal');
                renderDashboard();
            };
            openModal('delete-confirm-modal');
        }

        function viewImage(src) {
            document.getElementById('enlarged-image').src = src;
            openModal('image-view-modal');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        function renderLogsCards(filteredLogs) {
            const container = document.getElementById('logs-container');
            container.innerHTML = '';

            const sortedDates = Object.keys(filteredLogs).sort((a, b) => new Date(b) - new Date(a));

            if (sortedDates.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
                        <i data-lucide="calendar-x" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                        <p class="text-sm font-medium">この期間の記録はありません</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            sortedDates.forEach(dateStr => {
                const log = filteredLogs[dateStr];
                const dateObj = new Date(dateStr);
                const formattedDate = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日 (${['日','月','火','水','木','金','土'][dateObj.getDay()]})`;

                const foodImgs = Array.isArray(log.foodImg) ? log.foodImg : (log.foodImg ? [log.foodImg] : []);
                const workoutImgs = Array.isArray(log.workoutImg) ? log.workoutImg : (log.workoutImg ? [log.workoutImg] : []);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition";
                
                card.innerHTML = `
                    <div class="p-5 space-y-4">
                        <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                            <span class="font-bold text-slate-800 text-base">${formattedDate}</span>
                            <div class="flex items-center space-x-1">
                                <button onclick="openModal('add-log-modal', '${dateStr}')" class="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg hover:bg-slate-100 transition" title="編集">

                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <div>
                                <span class="text-[10px] uppercase font-bold text-slate-400 block">歩数</span>
                                <span class="text-sm font-bold text-slate-700">${log.steps ? log.steps.toLocaleString() + ' 歩' : '--'}</span>
                            </div>
                            <div>
                                <span class="text-[10px] uppercase font-bold text-slate-400 block">体重</span>
                                <span class="text-sm font-bold text-slate-700">${log.weight ? log.weight + ' kg' : '--'}</span>
                            </div>
                        </div>

                        <!-- あすけん（食事）セクション -->
                        ${ (foodImgs.length > 0 || log.foodMemo) ? `
                            <div class="space-y-2">
                                <span class="text-xs font-bold text-amber-700 flex items-center space-x-1">
                                    <i data-lucide="utensils" class="w-3.5 h-3.5"></i>
                                    <span>あすけん</span>
                                </span>
                                ${ foodImgs.length > 0 ? `
                                    <div class="grid grid-cols-3 gap-1.5">
                                        ${ foodImgs.map(img => `
                                            <img src="${img}" onclick="viewImage('${img}')" class="w-full h-16 object-cover rounded-lg border border-slate-200 cursor-pointer hover:opacity-90 transition">
                                        `).join('') }
                                    </div>
                                ` : ''}
                                ${ log.foodMemo ? `<p class="text-xs text-slate-600 bg-amber-50/50 p-2 rounded-lg border border-amber-100">${escapeHtml(log.foodMemo)}</p>` : ''}
                            </div>
                        ` : ''}

                        <!-- 筋トレセクション -->
                        ${ (workoutImgs.length > 0 || log.workoutMemo) ? `
                            <div class="space-y-2">
                                <span class="text-xs font-bold text-indigo-700 flex items-center space-x-1">
                                    <i data-lucide="dumbbell" class="w-3.5 h-3.5"></i>

                                ${ workoutImgs.length > 0 ? `
                                    <div class="grid grid-cols-3 gap-1.5">

                                ${ log.workoutMemo ? `<p class="text-xs text-slate-600 bg-indigo-50/50 p-2 rounded-lg border border-indigo-100">${escapeHtml(log.workoutMemo)}</p>` : ''}

                container.appendChild(card);
            });

            lucide.createIcons();
        }

        // ローカルストレージへデータを保存
        function saveLogsToStorage() {
            try {
                localStorage.setItem('fithub_logs_data', JSON.stringify(logsData));
            } catch (e) {
                console.error("データ保存エラー (容量制限などの可能性があります):", e);
            }
        }

        // --- GAS (GOOGLE APPS SCRIPT) CLOUD SYNC ---
        async function saveToGoogleDrive() {
            if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_GAS_WEB_APP_URL')) {
                alert('GASのウェブアプリURLが設定されていません。コード内の GAS_WEB_APP_URL を書き換えてください。');
                return;
            }

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(logsData)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const resData = await response.json();
                if (resData.status === 'success') {
                    alert('☁️ クラウド（GAS）へデータを保存しました！');
                } else {
                    throw new Error(resData.message || 'Save Failed');
                }
            } catch (err) {
                console.error("GAS Save Error:", err);
                alert(`クラウドへの保存に失敗しました。\n詳細: ${err.message}\n\n※GASのアクセスポリシーが「全員」になっているかご確認ください。`);
            }
        }

        async function loadFromGoogleDrive() {
            if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_GAS_WEB_APP_URL')) {
                alert('GASのウェブアプリURLが設定されていません。コード内の GAS_WEB_APP_URL を書き換えてください。');
                return;
            }

            try {
                const response = await fetch(GAS_WEB_APP_URL);
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                const cloudData = await response.json();
                if (cloudData && typeof cloudData === 'object') {
                    logsData = { ...logsData, ...cloudData };
                    saveLogsToStorage();
                    renderDashboard();
                    alert('☁️ クラウド（GAS）から最新データを同期しました！');
                }
            } catch (err) {
                console.error("GAS Load Error:", err);
                alert(`クラウドからの読み込みに失敗しました。\n詳細: ${err.message}`);
            }
        }

        // --- GOOGLE HEALTH / FIT SYNC LOGIC ---
        function initGoogleClient() {
            if (typeof google === 'undefined' || !google.accounts) return;
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: SCOPES,
                callback: async (tokenResponse) => {
                    if (tokenResponse.error !== undefined) {
                        throw (tokenResponse);
                    }
                    accessToken = tokenResponse.access_token;
                    document.getElementById('sync-status').textContent = 'データ同期中...';
                    await fetchFitnessData();
                },
            });
        }

        function handleGoogleFitSync() {
            if (GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID')) {
                alert('Google Client IDが未設定です。コード内の GOOGLE_CLIENT_ID を指定してください。');
                return;
            }
            if (!tokenClient) initGoogleClient();
            
            if (accessToken === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                fetchFitnessData();
            }
        }

        async function fetchFitnessData() {
            const now = new Date();
            const startTimeMillis = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            const endTimeMillis = now.getTime();

            try {
                const response = await fetch('https://www.googleapis.com/fitness/v1/users/me/dataset:aggregate', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        "aggregateBy": [
                            { "dataTypeName": "com.google.step_count.delta" },
                            { "dataTypeName": "com.google.weight" }
                        ],
                        "bucketByTime": { "durationMillis": 86400000 },
                        "startTimeMillis": startTimeMillis,
                        "endTimeMillis": endTimeMillis
                    })
                });

                const data = await response.json();
                if (data.bucket) {
                    data.bucket.forEach(bucket => {
                        const dateStr = new Date(parseInt(bucket.startTimeMillis)).toISOString().split('T')[0];
                        let steps = 0;
                        let weight = null;

                        bucket.dataset.forEach(ds => {
                            if (ds.dataSourceId.includes('step_count')) {
                                ds.point.forEach(pt => {
                                    pt.value.forEach(val => { steps += val.intVal || 0; });
                                });
                            }
                            if (ds.dataSourceId.includes('weight')) {
                                ds.point.forEach(pt => {
                                    pt.value.forEach(val => { weight = val.fpVal || null; });
                                });
                            }
                        });

                        if (!logsData[dateStr]) {
                            logsData[dateStr] = { steps: 0, weight: null, foodImg: [], foodMemo: '', workoutImg: [], workoutMemo: '' };
                        }
                        if (steps > 0) logsData[dateStr].steps = steps;
                        if (weight !== null) logsData[dateStr].weight = weight;
                    });

                    saveLogsToStorage();
                    renderDashboard();
                    document.getElementById('sync-status').textContent = '同期完了';
                    setTimeout(() => { document.getElementById('sync-status').textContent = 'Google Health 本番同期'; }, 3000);
                }
            } catch (err) {
                console.error("Fit API Error:", err);
                alert("Google Health データの取得に失敗しました。");
                document.getElementById('sync-status').textContent = 'Google Health 本番同期';
            }
        }

        // --- DASHBOARD & CHARTS LOGIC ---
        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderDashboard();
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            ['month', 'week', 'day'].forEach(m => {
                const btn = document.getElementById(`view-btn-${m}`);
                if (m === mode) {
                    btn.className = "px-3 py-1.5 rounded-lg transition bg-white text-slate-800 shadow-sm font-semibold";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg transition hover:text-slate-800 font-semibold";
                }
            });
            renderDashboard();
        }

        function getFilteredLogs() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const filtered = {};
            Object.keys(logsData).forEach(dateStr => {
                const d = new Date(dateStr);
                if (currentViewMode === 'month') {
                    if (d.getFullYear() === year && d.getMonth() === month) {
                        filtered[dateStr] = logsData[dateStr];
                    }
                } else if (currentViewMode === 'week') {
                    const now = new Date(currentDate);
                    const weekAgo = new Date(now);
                    weekAgo.setDate(now.getDate() - 7);
                    if (d >= weekAgo && d <= now) {
                        filtered[dateStr] = logsData[dateStr];
                    }
                } else if (currentViewMode === 'day') {
                    const targetStr = currentDate.toISOString().split('T')[0];
                    if (dateStr === targetStr) {
                        filtered[dateStr] = logsData[dateStr];
                    }
                }
            });
            return filtered;
        }

        function renderDashboard() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            document.getElementById('current-month-display').textContent = `${year}年 ${month}月`;

            const filteredLogs = getFilteredLogs();

            // 統計データの更新
            let totalSteps = 0, stepCount = 0;
            let totalWeight = 0, weightCount = 0;
            let foodDays = 0, workoutDays = 0;

            Object.values(filteredLogs).forEach(log => {
                if (log.steps) { totalSteps += log.steps; stepCount++; }
                if (log.weight) { totalWeight += log.weight; weightCount++; }
                if ((Array.isArray(log.foodImg) && log.foodImg.length > 0) || log.foodMemo) foodDays++;
                if ((Array.isArray(log.workoutImg) && log.workoutImg.length > 0) || log.workoutMemo) workoutDays++;
            });

            document.getElementById('stat-avg-steps').textContent = stepCount > 0 ? `${Math.round(totalSteps / stepCount).toLocaleString()} 歩` : '-- 歩';
            document.getElementById('stat-avg-weight').textContent = weightCount > 0 ? `${(totalWeight / weightCount).toFixed(1)} kg` : '-- kg';
            document.getElementById('stat-food-count').textContent = `${foodDays} 日`;
            document.getElementById('stat-workout-count').textContent = `${workoutDays} 日`;

            // カードレンダリング
            renderLogsCards(filteredLogs);

            // グラフ更新
            updateCharts(filteredLogs);
        }

        function initCharts() {
            const ctxWeight = document.getElementById('weightChart').getContext('2d');
            weightChartInstance = new Chart(ctxWeight, {
                type: 'line',
                data: { labels: [], datasets: [{ label: '体重 (kg)', data: [], borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const ctxSteps = document.getElementById('stepsChart').getContext('2d');
            stepsChartInstance = new Chart(ctxSteps, {
                type: 'bar',
                data: { labels: [], datasets: [{ label: '歩数', data: [], backgroundColor: '#14b8a6', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function updateCharts(filteredLogs) {
            const sortedDates = Object.keys(filteredLogs).sort();
            const labels = sortedDates.map(d => {
                const dateObj = new Date(d);
                return `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
            });

            const weights = sortedDates.map(d => filteredLogs[d].weight || null);
            const steps = sortedDates.map(d => filteredLogs[d].steps || 0);

            if (weightChartInstance) {
                weightChartInstance.data.labels = labels;
                weightChartInstance.data.datasets[0].data = weights;
                weightChartInstance.update();
            }

            if (stepsChartInstance) {
                stepsChartInstance.data.labels = labels;
                stepsChartInstance.data.datasets[0].data = steps;
                stepsChartInstance.update();
            }
        }

        function fillMockHealthData() {
            document.getElementById('form-steps').value = Math.floor(Math.random() * 5000) + 5000;
            document.getElementById('form-weight').value = (60 + Math.random() * 5).toFixed(1);
        }
    </script>
</body>
