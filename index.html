<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitHub - 月別ダイエット総合管理アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

            <div class="flex flex-col sm:flex-row sm:justify-between sm:h-16 justify-center items-center gap-2.5 sm:gap-0">
                
                <!-- Logo & Main Add Action -->

                    <div class="flex items-center space-x-2.5">
                        <div class="bg-emerald-500 text-white p-1.5 sm:p-2 rounded-xl shadow-md">
                            <i data-lucide="activity" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                        </div>
                        <span class="text-lg sm:text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">
                            FitHub Log

                    </div>

                    <!-- Mobile Add Button (Visible only on small screens) -->
                    <button onclick="openModal('add-log-modal')" class="sm:hidden bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition flex items-center space-x-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>記録追加</span>
                    </button>
                </div>

                <!-- Google Health Real Sync & Data Sync Buttons -->
                <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto space-x-2 overflow-x-auto pb-1 sm:pb-0">
                    <!-- データバックアップ・同期用ボタン（Google ドライブ連携） -->
                    <div class="flex items-center space-x-1.5">
                        <button id="cloud-sync-btn" onclick="syncAll({silent:false})" title="Googleドライブと同期（データ＋画像）" class="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium transition border border-slate-300 shrink-0">
                            <span id="cloud-icon" class="inline-flex"><i data-lucide="cloud" class="w-3.5 h-3.5 text-blue-600"></i></span>
                            <span id="cloud-sync-label">クラウド同期</span>
                        </button>
                    </div>

                    <button id="sync-health-btn" onclick="handleGoogleHealthSync()" title="Google Healthから歩数・体重を取得（表示中の月）" class="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium transition border border-slate-300 shrink-0">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-emerald-600" id="sync-icon"></i>

                        <i data-lucide="plus" class="w-4 h-4"></i>

    <!-- Main Container -->

            <div class="flex items-center space-x-4">

    <!-- Modal: Add / Edit Daily Log -->
    <div id="add-log-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden my-8">

            <form id="log-form" onsubmit="saveLog(event)" class="p-6 space-y-4">

                        <div>

                            <input type="number" step="0.1" id="form-weight" placeholder="65.0" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm">

                    <input type="file" id="form-asuken-file" accept="image/*" multiple onchange="handleMultipleImages(this, 'asuken')" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200">

                    <p class="text-[10px] text-slate-400">PCは Ctrl+V で貼り付け / ドラッグ&ドロップもOK</p>
                    <div id="workout-preview-container" class="grid grid-cols-3 gap-2 mt-2"></div>
                    <textarea id="form-workout-memo" placeholder="トレーニング内容・部位のメモ" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs mt-2"></textarea>

    <!-- Image View Modal -->

    <style>#enlarged-image.zoomed { max-width: none; max-height: none; cursor: zoom-out; }</style>

    <script>
        // --- GOOGLE API CONFIGURATION ---
        const GOOGLE_CLIENT_ID = '84961533777-9v8b9q99mf16n4gk4745alhb6sf2ius8.apps.googleusercontent.com';
        // Google Health API（旧Google Fit APIの後継）。歩数=activity_and_fitness / 体重=health_metrics_and_measurements
        const SCOPES = 'https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly';
        const HEALTH_API_BASE = 'https://health.googleapis.com/v4/users/me';
        // 集計に使うデータソース。'' = 全ソース統合（既定・Googleヘルスアプリの表示に最も近い）
        // アプリ側の値とズレる場合は 'users/me/dataSourceFamilies/google-sources' や 'users/me/dataSourceFamilies/google-wearables' を試してください
        const HEALTH_SOURCE_FAMILY = '';

        // ★ GAS のウェブアプリURL（新しい Code.gs を再デプロイしてもURLは同じです）
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwYtdBV7TgzT6Xe5assNJuSzsVya7QMlyYgjuw1ZYmlo1iDrbKGCA_1TGCimw_3osX-Ug/exec';

        let tokenClient;
        let accessToken = null;

        // State
        let currentDate = new Date();
        let currentViewMode = 'month';
        let logsData = {};          // { 'YYYY-MM-DD': { steps, weight, foodImg:[id], ..., updatedAt, deleted? } }
        let weightChartInstance = null;
        let stepsChartInstance = null;
        let currentFormImages = { asuken: [], workout: [] }; // 画像ID配列
        let lastImageTarget = 'asuken';                      // 貼り付け先
        let renderToken = 0;

        // ===== 日付ヘルパー（ローカル時間基準）=====
        function toLocalDateStr(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }
        function parseLocalDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        // ===== 画像ストア（IndexedDB + メモリキャッシュ）=====
        // 画像本体は IndexedDB に保存し、記録データには画像ID(ハッシュ)だけを持たせる。
        // → localStorageの容量問題を回避 / 同じ画像は同じIDになるのでPC・スマホ間で重複しない
        const imgCache = new Map();
        let dbPromise = null;
        function openDB() {
            if (dbPromise) return dbPromise;
            dbPromise = new Promise((resolve, reject) => {
                const req = indexedDB.open('fithub_db', 1);
                req.onupgradeneeded = () => req.result.createObjectStore('images');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return dbPromise;
        }
        async function idbGet(id) {
            try {
                const db = await openDB();
                return await new Promise((res, rej) => {
                    const r = db.transaction('images').objectStore('images').get(id);
                    r.onsuccess = () => res(r.result || null);
                    r.onerror = () => rej(r.error);
                });
            } catch (e) { return null; }
        }
        async function idbPut(id, data) {
            try {
                const db = await openDB();
                await new Promise((res, rej) => {
                    const tx = db.transaction('images', 'readwrite');
                    tx.objectStore('images').put(data, id);
                    tx.oncomplete = res;
                    tx.onerror = () => rej(tx.error);
                });
            } catch (e) { console.error('IndexedDB保存エラー:', e); }
        }
        async function getImageData(id) {
            if (imgCache.has(id)) return imgCache.get(id);
            const d = await idbGet(id);
            if (d) imgCache.set(id, d);
            return d;
        }
        async function storeImage(dataUrl, knownId = null) {
            const id = knownId || await makeImageId(dataUrl);
            imgCache.set(id, dataUrl);
            await idbPut(id, dataUrl);
            return id;
        }
        async function makeImageId(str) {
            try {
                if (window.crypto && crypto.subtle) {
                    const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));
                    const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                    return 'img_' + hex.slice(0, 24);
                }
            } catch (e) {}
            // フォールバック（cyrb53）
            let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
            for (let i = 0; i < str.length; i++) {
                const ch = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return 'img_' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16) + str.length.toString(16);
        }
        const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="64"><rect width="100%" height="100%" fill="#f1f5f9"/><text x="50%" y="55%" font-size="10" text-anchor="middle" fill="#94a3b8">読込中</text></svg>');
        function imgSrc(id) { return imgCache.get(id) || PLACEHOLDER; }
        async function preloadImages(ids) { await Promise.all(ids.map(id => getImageData(id))); }

        // ===== データ正規化・マージ =====
        function toIdArray(v) { return Array.isArray(v) ? v : (v ? [v] : []); }

        // 旧形式（base64文字列が直接入っている）を画像IDへ移行
        async function migrateLogs() {
            let changed = false;
            for (const key of Object.keys(logsData)) {
                const log = logsData[key];
                if (!log || log.deleted) continue;
                let migrated = false;
                for (const f of ['foodImg', 'workoutImg']) {
                    const arr = toIdArray(log[f]);
                    const out = [];
                    for (const item of arr) {
                        if (typeof item === 'string' && item.startsWith('data:')) {
                            out.push(await storeImage(item));
                            migrated = true;
                        } else if (item) out.push(item);
                    }
                    log[f] = out;
                }
                if (migrated) { log.updatedAt = Date.now(); changed = true; }
                if (typeof log.updatedAt !== 'number') log.updatedAt = 0;
            }
            if (changed) saveLogsToStorage();
        }

        // 日付ごとに updatedAt が新しい方を採用
        function mergeLogs(a, b) {
            const out = {};
            new Set([...Object.keys(a), ...Object.keys(b)]).forEach(k => {
                const x = a[k], y = b[k];
                if (!x) out[k] = y;
                else if (!y) out[k] = x;
                else out[k] = ((y.updatedAt || 0) > (x.updatedAt || 0)) ? y : x;
            });
            return out;
        }
        function collectImageIds(logs) {
            const ids = new Set();
            Object.values(logs).forEach(l => {
                if (!l || l.deleted) return;
                [...toIdArray(l.foodImg), ...toIdArray(l.workoutImg)].forEach(id => {
                    if (typeof id === 'string' && id.startsWith('img_')) ids.add(id);
                });
            });
            return [...ids];
        }

        // ===== 初期化 =====
        window.onload = async function() {
            loadLogsFromStorage();
            await migrateLogs();
            initGoogleClient();
            initCharts();
            await renderDashboard();
            lucide.createIcons();
            setupImageInputs();

            // 起動時に自動同期（PC/スマホ共通）
            syncAll({ silent: true });
            // タブ/アプリに戻ったとき・オンライン復帰時・一定間隔で自動同期
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && Date.now() - lastSyncAt > 30000) syncAll({ silent: true });
            });
            window.addEventListener('online', () => syncAll({ silent: true }));
            setInterval(() => { if (document.visibilityState === 'visible') syncAll({ silent: true }); }, 120000);
        };

        function loadLogsFromStorage() {
            const stored = localStorage.getItem('fithub_logs_data');
            if (stored) {
                try { logsData = JSON.parse(stored) || {}; }

            } else {
                logsData = {};
            }
        }

        // ===== モーダル =====
        async function openModal(modalId, dateStr = null) {

        // ===== 画像の追加（ファイル選択 / 貼り付け / ドラッグ&ドロップ）=====
        function compressImage(base64Str, maxDim = 2560, quality = 0.88) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    const scale = Math.min(1, maxDim / Math.max(width, height));
                    width = Math.round(width * scale);
                    height = Math.round(height * scale);
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(base64Str);
                img.src = base64Str;
            });
        }
        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = e => resolve(e.target.result);
                r.onerror = reject;
                r.readAsDataURL(file);
            });
        }
        async function addImageFiles(files, type) {
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                const raw = await readFileAsDataURL(file);
                const compressed = await compressImage(raw);
                const id = await storeImage(compressed);
                if (!currentFormImages[type].includes(id)) currentFormImages[type].push(id);
            }
            await renderImagePreviews(type);
        }
        async function handleMultipleImages(input, type) {
            const files = Array.from(input.files);
            if (!files.length) return;
            await addImageFiles(files, type);
            input.value = '';
        }
        function setupImageInputs() {

                sec.addEventListener('dragleave', () => sec.classList.remove('bg-slate-50'));

                if (!files.length) return;

        // ===== クラウド同期（GAS + Googleドライブ）=====
        // 流れ: ①記録データを送信→サーバー側で日付ごとに新しい方をマージして返却
        //       ②サーバーに無い画像を1枚ずつアップロード
        //       ③この端末に無い画像を1枚ずつダウンロード
        let syncing = false, syncQueued = false, lastSyncAt = 0, syncTimer = null;

        function gasConfigured() { return GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes('YOUR_GAS_WEB_APP_URL'); }

        function setSyncState(state, text) {
            const label = document.getElementById('cloud-sync-label');
            const icon = document.getElementById('cloud-icon');
            const btn = document.getElementById('cloud-sync-btn');
            if (!label) return;
            label.textContent = text;
            icon.classList.toggle('animate-spin', state === 'syncing');
            btn.classList.toggle('border-rose-300', state === 'error');
            btn.classList.toggle('text-rose-600', state === 'error');
        }
        function hhmm() { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }

        // GASの応答をテキストで受け取り、JSONでなければ内容の先頭を添えてエラーにする（原因特定用）
        async function parseGasResponse(res) {
            const text = await res.text();
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0, 120).replace(/<[^>]*>/g, ' ')}`);
            try { return JSON.parse(text); }
            catch (e) {
                throw new Error('GASの応答がJSONではありません（権限未承認・デプロイ未更新の可能性）: ' + text.slice(0, 120).replace(/<[^>]*>/g, ' ').trim());
            }
        }
        async function gasPost(payload) {
            const res = await fetch(GAS_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
            return await parseGasResponse(res);
        }
        async function gasGet(params) {
            const res = await fetch(`${GAS_WEB_APP_URL}?${new URLSearchParams(params)}`);
            return await parseGasResponse(res);
        }

        function scheduleSync() {
            clearTimeout(syncTimer);
            syncTimer = setTimeout(() => syncAll({ silent: true }), 1500);
        }

        async function syncAll({ silent = false } = {}) {
            if (!gasConfigured()) {
                if (!silent) alert('GASのウェブアプリURLが設定されていません。コード内の GAS_WEB_APP_URL を書き換えてください。');
                return;
            }
            if (syncing) { syncQueued = true; return; }
            syncing = true;
            setSyncState('syncing', '同期中…');
            try {
                // ① データ同期
                const res = await gasPost({ action: 'sync', logs: logsData });
                if (res.status !== 'ok' || !res.logs) {
                    throw new Error(res.message || 'GASのコードが古い可能性があります（新しい Code.gs を再デプロイしてください）');
                }
                logsData = mergeLogs(res.logs, logsData); // 送信中に編集された分も保持
                await migrateLogs();
                saveLogsToStorage();

                const serverIds = new Set(res.imageIds || []);
                const needed = collectImageIds(logsData);

                // ② アップロード（サーバーに無い画像）
                const toUpload = needed.filter(id => !serverIds.has(id));
                let up = 0, failed = 0;
                for (const id of toUpload) {
                    const data = await getImageData(id);
                    if (!data) continue;
                    setSyncState('syncing', `画像送信 ${++up}/${toUpload.length}`);
                    try {
                        const r = await gasPost({ action: 'putImage', id, data });
                        if (r.status !== 'ok') throw new Error(r.message);
                    } catch (e) { failed++; console.error('画像アップロード失敗', id, e); }
                }

                // ③ ダウンロード（この端末に無い画像）
                const missing = [];
                for (const id of needed) { if (!(await getImageData(id))) missing.push(id); }
                let down = 0;
                const queue = missing.slice();
                const worker = async () => {
                    while (queue.length) {
                        const id = queue.shift();
                        try {
                            const r = await gasGet({ action: 'image', id });
                            if (r.status === 'ok' && r.data) await storeImage(r.data, id);
                            else failed++;
                        } catch (e) { failed++; console.error('画像ダウンロード失敗', id, e); }
                        setSyncState('syncing', `画像受信 ${++down}/${missing.length}`);
                    }
                };
                await Promise.all([worker(), worker(), worker()]);

                await renderDashboard();
                lastSyncAt = Date.now();
                if (failed > 0) {
                    setSyncState('error', `一部失敗(${failed}) 再試行`);
                    if (!silent) alert(`画像の一部(${failed}件)が同期できませんでした。もう一度「クラウド同期」を押してください。`);
                } else {
                    setSyncState('ok', `同期済 ${hhmm()}`);
                    if (!silent) alert(`☁️ 同期しました！（画像 送信${toUpload.length}枚 / 受信${missing.length}枚）`);
                }
            } catch (err) {
                console.error('Sync Error:', err);
                setSyncState('error', '同期エラー（タップで再試行）');
                if (!silent) alert(`同期に失敗しました。\n詳細: ${err.message}\n\n※GASのアクセスが「全員」になっているか、最新の Code.gs を再デプロイしたかご確認ください。`);
            } finally {
                syncing = false;
                if (syncQueued) { syncQueued = false; syncAll({ silent: true }); }
            }
        }

        // ===== GOOGLE HEALTH API SYNC（歩数・体重）=====
        const HEALTH_LABEL = 'Google Health同期';
        const APP_BUILD = '2026-10-31-d'; // 反映確認用（コンソールに表示）
        console.log('FitHub build', APP_BUILD);
        function setHealthLabel(t) { document.getElementById('sync-status').textContent = t; }

        function initGoogleClient() {
            if (typeof google === 'undefined' || !google.accounts) return;
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: SCOPES,
                // 過去に許可した旧スコープ（Google Fit等）を混ぜない（混ざるとHealth APIが403 DISALLOWED_OAUTH_SCOPESで拒否する）
                include_granted_scopes: false,
                callback: async (tokenResponse) => {
                    if (tokenResponse.error !== undefined) {
                        console.error(tokenResponse);
                        alert('Googleの認証に失敗しました: ' + (tokenResponse.error_description || tokenResponse.error));
                        setHealthLabel(HEALTH_LABEL);
                        return;
                    }
                    accessToken = tokenResponse.access_token;
                    setHealthLabel('データ取得中...');
                    await fetchHealthData();
                },
            });
        }

        function handleGoogleHealthSync() {
            if (GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID')) {
                alert('Google Client IDが未設定です。コード内の GOOGLE_CLIENT_ID を指定してください。');
                return;
            }
            if (!tokenClient) initGoogleClient();
            if (!tokenClient) { alert('Google認証ライブラリの読み込みに失敗しました。再読み込みしてください。'); return; }
            if (accessToken === null) tokenClient.requestAccessToken({ prompt: 'consent', include_granted_scopes: false });
            else fetchHealthData();
        }

        async function healthFetch(path, { method = 'GET', body = null } = {}) {
            const opts = { method, headers: { 'Authorization': `Bearer ${accessToken}` } };
            if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
            const res = await fetch(HEALTH_API_BASE + path, opts);
            if (res.status === 401) { accessToken = null; const e = new Error('認証の有効期限が切れました'); e.code = 401; throw e; }
            const text = await res.text();
            let json = null;
            try { json = JSON.parse(text); } catch (e) {}
            if (!res.ok) {
                let msg = (json && json.error && json.error.message) || text.slice(0, 150);
                // 原因特定用：問題のスコープ名などの詳細があれば付ける
                try {
                    (json.error.details || []).forEach(d => {
                        if (d.metadata && d.metadata.disallowed_scopes) msg += ` [問題のスコープ: ${d.metadata.disallowed_scopes}]`;
                    });
                } catch (e) {}
                const e = new Error(`HTTP ${res.status}: ${msg}`);
                e.code = res.status;
                throw e;
            }
            return json || {};
        }

        function civilDateTime(d) {
            return { date: { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() }, time: { hours: 0, minutes: 0, seconds: 0, nanos: 0 } };
        }
        function civilDateToStr(c) {
            if (!c || !c.year) return null;
            return `${c.year}-${String(c.month).padStart(2, '0')}-${String(c.day).padStart(2, '0')}`;
        }

        // 表示中の月（未来日は除く）を Google Health API から取得して反映
        async function fetchHealthData() {
            const y = currentDate.getFullYear(), m = currentDate.getMonth();
            const first = new Date(y, m, 1);
            const today = new Date(); today.setHours(0, 0, 0, 0);
            if (first > today) { alert('未来の月は同期できません。'); setHealthLabel(HEALTH_LABEL); return; }
            let lastDay = new Date(y, m + 1, 0);
            if (lastDay > today) lastDay = today;
            const endExcl = new Date(lastDay.getFullYear(), lastDay.getMonth(), lastDay.getDate() + 1);

            try {
                // --- 歩数: dailyRollUp（複数端末・アプリのデータをGoogle側で統合した日次合計）---
                const stepsByDate = {};
                let pageToken = '';
                do {
                    const body = { range: { start: civilDateTime(first), end: civilDateTime(endExcl) }, windowSizeDays: 1 };
                    if (HEALTH_SOURCE_FAMILY) body.dataSourceFamily = HEALTH_SOURCE_FAMILY;
                    if (pageToken) body.pageToken = pageToken;
                    const r = await healthFetch('/dataTypes/steps/dataPoints:dailyRollUp', { method: 'POST', body });
                    (r.rollupDataPoints || []).forEach(dp => {
                        const ds = civilDateToStr(dp.civilStartTime && dp.civilStartTime.date);
                        const n = parseInt(dp.steps && dp.steps.countSum, 10);
                        if (ds && n > 0) stepsByDate[ds] = n;
                    });
                    pageToken = r.nextPageToken || '';
                } while (pageToken);

                // --- 体重: dataPoints.list（1日に複数回あれば最後の記録を採用）---
                const weightByDate = {};
                const latestMin = {};
                pageToken = '';
                do {
                    const params = new URLSearchParams({
                        filter: `weight.sample_time.civil_time >= "${toLocalDateStr(first)}" AND weight.sample_time.civil_time < "${toLocalDateStr(endExcl)}"`,
                        pageSize: '1000'
                    });
                    if (HEALTH_SOURCE_FAMILY) params.set('dataSourceFamily', HEALTH_SOURCE_FAMILY);
                    if (pageToken) params.set('pageToken', pageToken);
                    const r = await healthFetch('/dataTypes/weight/dataPoints?' + params.toString());
                    (r.dataPoints || []).forEach(dp => {
                        const w = dp.weight;
                        if (!w || !w.sampleTime || !w.sampleTime.civilTime) return;
                        const ct = w.sampleTime.civilTime;
                        const ds = civilDateToStr(ct.date);
                        const grams = Number(w.weightGrams);
                        if (!ds || !(grams > 0)) return;
                        const minutes = ((ct.time && ct.time.hours) || 0) * 60 + ((ct.time && ct.time.minutes) || 0);
                        if (latestMin[ds] === undefined || minutes >= latestMin[ds]) {
                            latestMin[ds] = minutes;
                            weightByDate[ds] = Math.round(grams / 100) / 10; // g → kg（小数1桁）
                        }
                    });
                    pageToken = r.nextPageToken || '';
                } while (pageToken);

                // --- 反映（値が変わった日だけ更新時刻を進める）---
                let updatedDays = 0;
                new Set([...Object.keys(stepsByDate), ...Object.keys(weightByDate)]).forEach(ds => {
                    let log = logsData[ds];
                    if (!log || log.deleted) {
                        log = { steps: 0, weight: null, foodImg: [], foodMemo: '', workoutImg: [], workoutMemo: '', updatedAt: 0 };
                    }
                    let changed = false;
                    if (stepsByDate[ds] !== undefined && log.steps !== stepsByDate[ds]) { log.steps = stepsByDate[ds]; changed = true; }
                    if (weightByDate[ds] !== undefined && log.weight !== weightByDate[ds]) { log.weight = weightByDate[ds]; changed = true; }
                    if (changed) { log.updatedAt = Date.now(); logsData[ds] = log; updatedDays++; }
                });

                saveLogsToStorage();
                renderDashboard();
                scheduleSync();
                setHealthLabel(`取得完了(${updatedDays}日更新)`);
                setTimeout(() => setHealthLabel(HEALTH_LABEL), 4000);
            } catch (err) {
                console.error('Google Health API Error:', err);
                setHealthLabel(HEALTH_LABEL);
                if (err.code === 401) {
                    // トークン切れ → 再認証（同意画面なし）
                    if (tokenClient) { setHealthLabel('再認証中...'); tokenClient.requestAccessToken({ prompt: '' }); return; }
                }
                let hint = '';
                if (err.code === 403 && /disallowed OAuth scope/i.test(err.message)) { accessToken = null; hint = '\\n\\n過去に許可した古いスコープが混ざっています。ページを再読み込みしてもう一度お試しください。直らない場合は https://myaccount.google.com/permissions でこのアプリのアクセス権を削除してから再度お試しください。'; }
                else if (err.code === 403) hint = '\n\n【確認】\n・Google CloudでGoogle Health APIを有効化したか\n・OAuth同意画面の「データアクセス」にGoogle Health APIのスコープを追加したか\n・自分のアカウントを「テストユーザー」に登録したか\n・同意画面で歩数/体重の許可にチェックを入れたか';
                else if (err.code === 400 && /ACCOUNT_NOT_LINKED/.test(err.message)) hint = '\n\n先にスマホのGoogle Healthアプリで、このGoogleアカウントでログインしてください。';
                else if (err.code === 429) hint = '\n\nリクエスト制限に達しました。少し待ってから再試行してください。';
                else if (/Failed to fetch/i.test(err.message)) hint = '\n\n通信エラー、またはブラウザからのアクセスがブロックされた可能性があります（コンソールを確認してください）。';
                alert('Google Healthデータの取得に失敗しました。\n詳細: ' + err.message + hint);
            }
        }

        // ===== DASHBOARD & CHARTS =====
        function changeMonth(delta) {
            currentDate.setDate(1);
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderDashboard();
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            ['month', 'week', 'day'].forEach(m => {
                const btn = document.getElementById(`view-btn-${m}`);
                btn.className = (m === mode)
                    ? "px-3 py-1.5 rounded-lg transition bg-white text-slate-800 shadow-sm font-semibold"
                    : "px-3 py-1.5 rounded-lg transition hover:text-slate-800 font-semibold";
            });
            renderDashboard();
        }

        function getFilteredLogs() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const filtered = {};
            Object.keys(logsData).forEach(dateStr => {
                if (logsData[dateStr].deleted) return;
                const d = parseLocalDate(dateStr);
                if (currentViewMode === 'month') {
                    if (d.getFullYear() === year && d.getMonth() === month) filtered[dateStr] = logsData[dateStr];
                } else if (currentViewMode === 'week') {
                    const now = new Date(currentDate);
                    const weekAgo = new Date(now);
                    weekAgo.setDate(now.getDate() - 7);
                    if (d >= weekAgo && d <= now) filtered[dateStr] = logsData[dateStr];
                } else if (currentViewMode === 'day') {
                    if (dateStr === toLocalDateStr(currentDate)) filtered[dateStr] = logsData[dateStr];
                }
            });
            return filtered;
        }

        async function renderDashboard() {
            const token = ++renderToken;
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            document.getElementById('current-month-display').textContent = `${year}年 ${month}月`;

            const filteredLogs = getFilteredLogs();

            let totalSteps = 0, stepCount = 0, totalWeight = 0, weightCount = 0, foodDays = 0, workoutDays = 0;
            Object.values(filteredLogs).forEach(log => {
                if (log.steps) { totalSteps += log.steps; stepCount++; }
                if (log.weight) { totalWeight += log.weight; weightCount++; }
                if (toIdArray(log.foodImg).length > 0 || log.foodMemo) foodDays++;
                if (toIdArray(log.workoutImg).length > 0 || log.workoutMemo) workoutDays++;
            });
            document.getElementById('stat-avg-steps').textContent = stepCount > 0 ? `${Math.round(totalSteps / stepCount).toLocaleString()} 歩` : '-- 歩';
            document.getElementById('stat-avg-weight').textContent = weightCount > 0 ? `${(totalWeight / weightCount).toFixed(1)} kg` : '-- kg';
            document.getElementById('stat-food-count').textContent = `${foodDays} 日`;
            document.getElementById('stat-workout-count').textContent = `${workoutDays} 日`;

            updateCharts(filteredLogs);
            await preloadImages(collectImageIds(filteredLogs));
            if (token !== renderToken) return; // 新しい描画が走っていれば破棄
            renderLogsCards(filteredLogs);
        }

        function initCharts() {
            weightChartInstance = new Chart(document.getElementById('weightChart').getContext('2d'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: '体重 (kg)', data: [], borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
            stepsChartInstance = new Chart(document.getElementById('stepsChart').getContext('2d'), {
                type: 'bar',
                data: { labels: [], datasets: [{ label: '歩数', data: [], backgroundColor: '#14b8a6', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function updateCharts(filteredLogs) {
            const sortedDates = Object.keys(filteredLogs).sort();
            const labels = sortedDates.map(d => { const o = parseLocalDate(d); return `${o.getMonth() + 1}/${o.getDate()}`; });
            const weights = sortedDates.map(d => filteredLogs[d].weight || null);
            const steps = sortedDates.map(d => filteredLogs[d].steps || 0);

            if (weightChartInstance) {
                weightChartInstance.data.labels = labels;
                weightChartInstance.data.datasets[0].data = weights;
                weightChartInstance.update();
            }
            if (stepsChartInstance) {
                stepsChartInstance.data.labels = labels;
                stepsChartInstance.data.datasets[0].data = steps;
                stepsChartInstance.update();
            }
        }

        function fillMockHealthData() {
            document.getElementById('form-steps').value = Math.floor(Math.random() * 5000) + 5000;
            document.getElementById('form-weight').value = (60 + Math.random() * 5).toFixed(1);
        }
</script>
</body>
</html>
